# Februus: USB devices allowed on the station (USBGuard).
# Copy to /etc/usbguard/rules.conf (install.sh, T14), with
# ImplicitPolicyTarget=block in /etc/usbguard/usbguard-daemon.conf:
# everything not allowed below is blocked.
#
# 1. The devices of the station itself (keyboard, mouse, internal hubs,
#    screen...) are added by install.sh from "usbguard generate-policy",
#    run when the station is installed, before this file is used.
#
# 2. USB keys and USB disks: EVERY interface must be mass storage (class
#    08). "match-all" allows a device whose interfaces are all class 08,
#    whatever their number: a plain key (one interface), and also a USB3
#    disk enclosure that offers UAS (two interfaces, 08:06:50 + 08:06:62).
#    A "key" that also declares a keyboard (HID 03) or a network interface
#    has an interface outside class 08, so it is NOT allowed (blocked).
#    "equals { 08:*:* }" (used before) required EXACTLY ONE interface and
#    wrongly blocked UAS enclosures (f1, 2026-10-13, JMicron 152d:0562).
# FR : toute interface doit être du stockage (classe 08) ; "match-all"
# accepte une ou plusieurs interfaces de stockage (clé simple ET boîtier
# USB3 en UAS), mais bloque une « clé » qui se déclare aussi clavier.
allow with-interface match-all { 08:*:* }

# External USB hubs are blocked: a key must be plugged in directly.
