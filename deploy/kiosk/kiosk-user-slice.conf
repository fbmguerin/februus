# Februus kiosk: every process of the account februus-kiosk (cage, Firefox)
# may only reach this machine. Installed by "deploy/install.sh --kiosk" as
# /etc/systemd/system/user-<uid of februus-kiosk>.slice.d/50-februus.conf.
# On the user slice, not in februus-kiosk.service: PAMName=login moves cage
# and Firefox into a logind session scope, out of the service (f1: the
# restriction in the service did not apply to Firefox).
# FR : le navigateur du kiosque ne peut joindre que cette machine.
[Slice]
IPAddressDeny=any
IPAddressAllow=localhost
