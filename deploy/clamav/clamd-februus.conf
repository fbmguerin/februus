# clamd settings required by Februus, applied to /etc/clamav/clamd.conf by
# apply-clamd-settings.sh (devcontainer, dev setup, later install.sh).
#
# FAIL-CLOSED: without these alerts, clamd answers "OK" for an encrypted
# archive or PDF, or for a file too big to be scanned: the key would be
# green. With them, clamd reports Heuristics.Encrypted.* and
# Heuristics.Limits.Exceeded.*, which Februus maps to red findings.
# FR : sans ces alertes, une archive chiffrée ou un fichier trop gros
# serait déclaré sain (vert).
AlertEncrypted yes
AlertExceedsMax yes
ScanArchive yes
# No "EnableVersionCommand" here: clamd 1.4.3 (Debian 13) does not know
# this option and refuses to start with it. Its VERSION command (signatures
# version shown on screen) always answers.
ScanPDF yes
# Size limits. Bigger files are not scanned and give "scan.limit_exceeded"
# (red). To review with the user: real keys often hold big videos or ISOs.
MaxFileSize 1000M
MaxScanSize 2000M
StreamMaxLength 1000M
