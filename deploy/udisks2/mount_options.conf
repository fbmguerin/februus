# Februus: mount options of udisks2 for the USB keys.
# Copy to /etc/udisks2/mount_options.conf (install.sh, T14).
#
# "defaults" are used when Februus does not give an option; "allow" is the
# only list of options a caller may ask for. exec, suid and dev are not in
# it: noexec,nosuid,nodev can never be removed.
# The kernel_mount reader also checks the real options after each mount
# (/proc/self/mountinfo) and refuses the key otherwise.
# To check on the mini-PC (T12): udisks2 version of Debian 13, real keys.
# FR : exec, suid et dev ne sont pas autorisés : noexec,nosuid,nodev
# ne peuvent jamais être retirés.

[defaults]
defaults=ro,noexec,nosuid,nodev
allow=ro,rw,noexec,nosuid,nodev,sync,dirsync
