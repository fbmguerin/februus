# Februus kiosk: one text console for the administrator (tty2), nothing on
# tty3 to tty6. tty1 is the kiosk. Installed by "deploy/install.sh --kiosk"
# in /etc/systemd/logind.conf.d/; read at boot.
# FR : une seule console texte de secours (Ctrl+Alt+F2), aucune sur F3 à F6.
[Login]
NAutoVTs=2
ReserveVT=0
